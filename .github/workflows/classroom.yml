name: Autograding Tests
'on':
- push
- repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Q08_62 Test 1
      id: q08_62-test-1
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Q08_62 Test 1
        setup-command: javac Q08_62/*.java
        command: java -cp Q08_62 BattingStatsClient 34 35 30 23 24 32 22 38 26 79
          95 81 100 84 71 70 94 75
        input: ''
        expected-output: |-
          bStat1:
          Number of players: 9
          Hits:
          34 35 30 23 24 32 22 38 26
          At bats:
          79 95 81 100 84 71 70 94 75

          bStat2:
          The number of players is 9
          The hits for each player are: 34 35 30 23 24 32 22 38 26
          The at-bats for each player are: 79 95 81 100 84 71 70 94 75
          Objects are equal

          Using mutators to change bStat2 data

          bStat2:
          Number of players: 9
          Hits:
          30 35 30 23 24 32 22 38 26
          At bats:
          99 95 81 100 84 71 70 94 75
          Objects are not equal

          bStat2 batting averages:
          .303 .368 .370 .230 .286 .451 .314 .404 .347

          bStat2: The total number of hits is 260

          bStat2: The number of players with a batting average greater than .300 is 7
          The hits are:
          30 35 30 23 24 32 22 38 26
          The sorted hits are:
          22 23 24 26 30 30 32 35 38
        comparison-method: contains
        timeout: 10
        max-score: 5
    - name: Q08_62 Test 2
      id: q08_62-test-2
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Q08_62 Test 2
        setup-command: javac Q08_62/*.java
        command: java -cp Q08_62 BattingStatsClient 20 33 35 40 25 15 21 24 36 100
          99 101 100 99 75 88 90 103
        input: ''
        expected-output: |-
          bStat1:
          Number of players: 9
          Hits:
          20 33 35 40 25 15 21 24 36
          At bats:
          100 99 101 100 99 75 88 90 103

          bStat2:
          The number of players is 9
          The hits for each player are: 20 33 35 40 25 15 21 24 36
          The at-bats for each player are: 100 99 101 100 99 75 88 90 103
          Objects are equal

          Using mutators to change bStat2 data

          bStat2:
          Number of players: 9
          Hits:
          30 33 35 40 25 15 21 24 36
          At bats:
          99 99 101 100 99 75 88 90 103
          Objects are not equal

          bStat2 batting averages: .303 .333 .347 .400 .253 .200 .239 .267 .350

          bStat2: The total number of hits is 259

          bStat2: The number of players with a batting average greater than .300 is 5
          The hits are:
          30 33 35 40 25 15 21 24 36
          The sorted hits are:
          15 21 24 25 30 33 35 36 40
        comparison-method: contains
        timeout: 10
        max-score: 5
    - name: Q08_63 Test 1
      id: q08_63-test-1
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Q08_63 Test 1
        setup-command: javac Q08_63/*.java
        command: java -cp Q08_63 GradesClient 31 21 72 81 31 81 32 0 38 74 91
        input: ''
        expected-output: |-
          Setting g1 and g2 arrays to studentGrades
          Grades: 31 21 72 81 31 81 32 0 38 74 91
          Comparing g1 and g2 for equality
          Objects are equal

          Sorted grades:
          0 21 31 31 32 38 72 74 81 81 91
          The highest grade is 91
          The average grade is 50.18
          The median grade is 38
          The mode is 31
        comparison-method: contains
        timeout: 10
        max-score: 5
    - name: Q08_63 Test 2
      id: q08_63-test-2
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Q08_63 Test 2
        setup-command: javac Q08_63/*.java
        command: java -cp Q08_63 GradesClient 4 15 92 31 42 55 61 78 80 23 99
        input: ''
        expected-output: |-
          Setting g1 and g2 arrays to studentGrades
          Grades: 4 15 92 31 42 55 61 78 80 23 99
          Comparing g1 and g2 for equality
          Objects are equal

          Sorted grades:
          4 15 23 31 42 55 61 78 80 92 99
          The highest grade is 99
          The average grade is 52.73
          The median grade is 55
          The mode is 4
        comparison-method: contains
        timeout: 10
        max-score: 5
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        Q08_62-TEST-1_RESULTS: "${{steps.q08_62-test-1.outputs.result}}"
        Q08_62-TEST-2_RESULTS: "${{steps.q08_62-test-2.outputs.result}}"
        Q08_63-TEST-1_RESULTS: "${{steps.q08_63-test-1.outputs.result}}"
        Q08_63-TEST-2_RESULTS: "${{steps.q08_63-test-2.outputs.result}}"
      with:
        runners: q08_62-test-1,q08_62-test-2,q08_63-test-1,q08_63-test-2
